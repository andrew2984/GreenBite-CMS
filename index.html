<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBite CMS - Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #68a062 0%, #bfdda5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            display: none;
        }

        .form-container.active {
            display: block;
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .form-header p {
            color: #666;
            font-size: 14px;
        }

        .toggle-link {
            color: #cd657a;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #cd657a;
            background-color: #f8f9ff;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            position: relative;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
            font-weight: 500;
            text-transform: capitalize;
        }

        .role-option input[type="radio"]:checked + label {
            background-color: #cd657a;
            color: white;
            border-color: #cd657a;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background-color: #cd657a;
            color: white;
        }

        .btn-primary:hover {
            background-color: #70ab5f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 135, 203, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideIn 0.3s ease-in-out;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .welcome-page {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease-in-out;
        }

        .welcome-page.active {
            display: block;
        }

        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .welcome-page h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .welcome-page .user-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 5px;
            margin: 30px 0;
            text-align: left;
        }

        .user-info p {
            margin: 10px 0;
            color: #555;
        }

        .user-info strong {
            color: #333;
        }

        .role-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 15px;
            text-transform: capitalize;
        }

        .role-badge.client {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .role-badge.planner {
            background-color: #fff3cd;
            color: #856404;
        }

        .role-badge.admin {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-logout {
            background-color: #dc3545;
            margin-top: 30px;
        }

        .btn-logout:hover {
            background-color: #c82333;
        }

        .loading {
            display: none;
            text-align: center;
            color: #cd657a;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #cd657a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading.show {
            display: block;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 30px 20px;
            }

            .form-header h2 {
                font-size: 24px;
            }

            .role-selector {
                grid-template-columns: 1fr;
            }

            .welcome-page {
                padding: 40px 20px;
            }

            .welcome-page h1 {
                font-size: 28px;
            }

            .welcome-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-container active" id="loginForm">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your GreenBite CMS account</p>
            </div>

            <div class="message" id="loginMessage"></div>
            <div class="loading" id="loginLoading">
                <div class="spinner"></div>
                <p>Signing in...</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        placeholder="your.email@example.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
                Don't have an account? 
                <span class="toggle-link" onclick="toggleForm('register')">Create one</span>
            </p>
        </div>

        <!-- Registration Form -->
        <div class="form-container" id="registerForm">
            <div class="form-header">
                <h2>Get Started</h2>
                <p>Create your GreenBite CMS account</p>
            </div>

            <div class="message" id="registerMessage"></div>
            <div class="loading" id="registerLoading">
                <div class="spinner"></div>
                <p>Creating account...</p>
            </div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerUsername">Full Name</label>
                    <input 
                        type="text" 
                        id="registerUsername" 
                        placeholder="John Doe" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="registerEmail" 
                        placeholder="your.email@example.com" 
                        required
                        onchange="checkEmailExists()"
                    >
                    <div style="font-size: 12px; color: #666; margin-top: 5px;" id="emailCheckMessage"></div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input 
                        type="password" 
                        id="registerPassword" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Select Your Role</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input 
                                type="radio" 
                                id="roleClient" 
                                name="role" 
                                value="client" 
                                checked
                            >
                            <label for="roleClient">Client</label>
                        </div>
                        <div class="role-option">
                            <input 
                                type="radio" 
                                id="rolePlanner" 
                                name="role" 
                                value="planner"
                            >
                            <label for="rolePlanner">Planner</label>
                        </div>
                        <div class="role-option">
                            <input 
                                type="radio" 
                                id="roleAdmin" 
                                name="role" 
                                value="admin"
                            >
                            <label for="roleAdmin">Admin</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
                Already have an account? 
                <span class="toggle-link" onclick="toggleForm('login')">Sign in</span>
            </p>
        </div>

        <!-- Welcome Page -->
        <div class="welcome-page" id="welcomePage">
            <div class="welcome-icon" id="welcomeIcon">👋</div>
            <h1>Welcome!</h1>
            <p id="welcomeMessage" style="color: #666; font-size: 16px; margin-bottom: 20px;"></p>

            <div class="user-info">
                <p><strong>Name:</strong> <span id="displayName"></span></p>
                <p><strong>Email:</strong> <span id="displayEmail"></span></p>
                <p><strong>Role:</strong> <span id="displayRole"></span></p>
            </div>

            <div class="role-badge" id="roleBadge"></div>

            <button class="btn btn-primary btn-logout" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Role configurations
        const roleConfig = {
            client: {
                icon: '👤',
                message: 'You are logged in as a Client. You can request events and manage your bookings.'
            },
            planner: {
                icon: '📋',
                message: 'You are logged in as an Event Planner. You can view and manage assigned events.'
            },
            admin: {
                icon: '👨‍💼',
                message: 'You are logged in as an Administrator. You have full access to the system.'
            }
        };

        function toggleForm(form) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (form === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                clearMessages();
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                clearMessages();
            }
        }

        function clearMessages() {
            document.getElementById('loginMessage').classList.remove('show', 'success', 'error');
            document.getElementById('registerMessage').classList.remove('show', 'success', 'error');
            document.getElementById('emailCheckMessage').textContent = '';
        }

        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.classList.add('show', type);
        }

        function showLoading(elementId, show) {
            const loadingEl = document.getElementById(elementId);
            if (show) {
                loadingEl.classList.add('show');
            } else {
                loadingEl.classList.remove('show');
            }
        }

        async function checkEmailExists() {
            const email = document.getElementById('registerEmail').value;
            const messageEl = document.getElementById('emailCheckMessage');

            if (!email) {
                messageEl.textContent = '';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/check-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.exists) {
                    messageEl.textContent = '❌ This email is already registered';
                    messageEl.style.color = '#dc3545';
                } else {
                    messageEl.textContent = '✓ Email is available';
                    messageEl.style.color = '#28a745';
                }
            } catch (error) {
                messageEl.textContent = '';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('loginMessage', 'Please fill in all fields', 'error');
                return;
            }

            showLoading('loginLoading', true);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store user data in session storage
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Show welcome page
                    showWelcomePage(data.user);
                    showMessage('loginMessage', 'Login successful! Redirecting...', 'success');
                } else {
                    showMessage('loginMessage', data.message || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('loginMessage', 'Error connecting to server: ' + error.message, 'error');
            } finally {
                showLoading('loginLoading', false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            if (!username || !email || !password) {
                showMessage('registerMessage', 'Please fill in all fields', 'error');
                return;
            }

            // Check password strength
            if (password.length < 6) {
                showMessage('registerMessage', 'Password must be at least 6 characters', 'error');
                return;
            }

            showLoading('registerLoading', true);

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        role
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('registerMessage', data.message + ' Redirecting to login...', 'success');
                    
                    // Auto-populate login form and switch to it
                    setTimeout(() => {
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginPassword').value = password;
                        toggleForm('login');
                    }, 1500);
                } else {
                    showMessage('registerMessage', data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage('registerMessage', 'Error connecting to server: ' + error.message, 'error');
            } finally {
                showLoading('registerLoading', false);
            }
        }

        function showWelcomePage(user) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const welcomePage = document.getElementById('welcomePage');

            loginForm.classList.remove('active');
            registerForm.classList.remove('active');
            welcomePage.classList.add('active');

            // Update welcome page with user data
            const config = roleConfig[user.role] || roleConfig.client;
            document.getElementById('welcomeIcon').textContent = config.icon;
            document.getElementById('welcomeMessage').textContent = config.message;
            document.getElementById('displayName').textContent = user.username;
            document.getElementById('displayEmail').textContent = user.email;
            document.getElementById('displayRole').textContent = user.roleDisplay;

            const roleBadge = document.getElementById('roleBadge');
            roleBadge.textContent = user.role.toUpperCase();
            roleBadge.className = `role-badge ${user.role}`;
        }

        function logout() {
            // Clear session storage
            sessionStorage.removeItem('user');

            // Reset forms
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();

            // Show login form
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('welcomePage').classList.remove('active');

            clearMessages();
        }

        // Check if user is already logged in on page load
        window.addEventListener('DOMContentLoaded', () => {
            const user = sessionStorage.getItem('user');
            if (user) {
                showWelcomePage(JSON.parse(user));
            }
        });
    </script>
</body>
</html>
